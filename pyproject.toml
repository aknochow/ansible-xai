[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aknochow-xai"
version = "0.1.0"
description = "Ansible collection that calls the xAI API (api.x.ai) via xai-sdk"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "ansible-core>=2.17.0,<2.20.0",
    "xai-sdk>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "ansible-lint>=24.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.uv]
# GHSA-69hj-f68j-2879 and GHSA-8mx5-7m5m-r77g are fixed in filelock
# 4.2.1 (Python >=3.11). This collection requires 3.11+, so stay on 4.2.4.
constraint-dependencies = [
    "filelock>=4.2.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"plugins/modules/*" = ["E402", "E501"]
